name: Two human reviewers
# TEST ONLY. Runs the gate pinned by the target branch's deps/c-build-tools, so propagation never edits this file and
# a pull request never selects the gate that judges it. Keep `pull_request_review`, or approvals never re-run it.
# Never check out PR code.
#   gh workflow run two-human-reviewers.yml -R <owner>/<repo> -f pr=<number>

on:
  workflow_dispatch:
    inputs:
      pr:
        description: PR number to evaluate.
        type: string
        required: true
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  pull-requests: read
  statuses: write

jobs:
  two-human-reviewers:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch the gate pinned by the target branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number || inputs.pr }}
        run: |
          set -euo pipefail
          # The target branch's current pointer, never the PR's own: a PR must not choose its gate.
          base_ref=$(gh api "repos/$REPO/pulls/$PR" --jq .base.ref)
          gate_sha=$(gh api -X GET "repos/$REPO/contents/deps/c-build-tools" -f ref="$base_ref" \
            --jq 'select(.type == "submodule") | .sha')
          if ! [[ "$gate_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::deps/c-build-tools on $base_ref is not a submodule."
            exit 1
          fi
          mkdir -p .gate
          gh api -X GET "repos/Azure/c-build-tools/contents/.github/actions/two-human-reviewers/action.yml" \
            -f ref="$gate_sha" -H "Accept: application/vnd.github.raw+json" > .gate/action.yml
          echo "::notice::Gate from Azure/c-build-tools $gate_sha, pinned by $base_ref."
      - uses: ./.gate
        with:
          pr: ${{ github.event.pull_request.number || inputs.pr }}